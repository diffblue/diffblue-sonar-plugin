name: Build and Test

on:
  pull_request:
  push:
    branches:
      - main
      - develop

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2
      with:
        fetch-depth: 0

    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'adopt'
        java-version: '17'
        cache: 'maven'

    - name: Run Spotless Check
      run: mvn spotless:check

    - name: Run Unit and Integration Tests
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: mvn install org.sonarsource.scanner.maven:sonar-maven-plugin:sonar

  compatibility-matrix:
    # Verify the plugin loads and produces correct coverage metrics across the range of
    # SonarQube Community Build versions we claim to support in the Marketplace properties.
    # Note: commercial SonarQube Server (sqs) images require a license and cannot be run here.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sonarqube-image:
          - 'sonarqube:9.9-community'                # oldest tested version (previous minimum)
          - 'sonarqube:25.1.0.102122-community'      # sqcb lower bound
          - 'sonarqube:26.7.0.124771-community'      # latest Community Build (sqcb upper bound)

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'adopt'
        java-version: '17'
        cache: 'maven'

    # SonarQube's bundled Elasticsearch requires a higher vm.max_map_count than the
    # runner default (65530); without this newer images fail to start.
    - name: Raise vm.max_map_count for Elasticsearch
      run: sudo sysctl -w vm.max_map_count=262144

    - name: Build plugin JAR
      run: mvn -pl sonar-plugin -am install -DskipTests

    - name: Run integration tests against ${{ matrix.sonarqube-image }}
      run: mvn -pl integration-tests verify -Dsonarqube.image=${{ matrix.sonarqube-image }}

  release-check:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'adopt'
        java-version: '17'
        cache: 'maven'

    - name: Check version number has been increased
      run: .github/scripts/check-version.sh

    - name: Fail if version is not releasable
      if: ${{ env.skip == 'true' }}
      run: |
        echo "::error::Version check failed: ${{ env.skip_reason }}"
        exit 1

    - name: Configure GPG Key
      run: |
        echo -n "$GPG_KEY_BASE64" | base64 --decode | gpg --batch --passphrase ${GPG_PASSPHRASE} --import
      env:
        GPG_KEY_BASE64: ${{ secrets.GPG_KEY_BASE64 }}
        GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

    - name: Build and sign artifact
      run: mvn install -B -P sign -Dgpg.passphrase="$GPG_PASSPHRASE"
      env:
        GPG_ID: ${{ secrets.GPG_ID }}
        GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

    - name: Upload artifact
      id: upload
      uses: actions/upload-artifact@v4
      with:
        name: diffblue-sonar-plugin-${{ env.current_version }}
        path: |
          sonar-plugin/target/diffblue-sonar-plugin-${{ env.current_version }}.jar
          sonar-plugin/target/diffblue-sonar-plugin-${{ env.current_version }}.jar.asc

    - name: Comment artifact link on PR
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        ARTIFACT_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts/${{ steps.upload.outputs.artifact-id }}"
        gh pr comment "${{ github.event.pull_request.number }}" --body "$(cat <<EOF
        **Build artifact for v${{ env.current_version }}**

        [Download diffblue-sonar-plugin-${{ env.current_version }}]($ARTIFACT_URL)
        EOF
        )"